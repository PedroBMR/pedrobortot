<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Página não encontrada — Pedro Bortot</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0a0c">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
/* Servida pelo GitHub Pages para qualquer endereço que não existe,
   inclusive as páginas do portfólio antigo. Caminhos sempre absolutos. */
@font-face{font-family:"Bricolage Grotesque";src:url(/assets/fonts/bricolage-grotesque-latin.woff2) format("woff2");font-weight:500 800;font-display:swap}
@font-face{font-family:"Public Sans";src:url(/assets/fonts/public-sans-latin.woff2) format("woff2");font-weight:400 700;font-display:swap}
:root{color-scheme:dark;--bg:#0a0a0c;--sup:#16161a;--borda-2:#26262e;--txt:#f2f2f0;--txt-2:#b6b6bc;--roxo:#7b2cbf;--roxo-2:#9d4edd;--roxo-3:#c77dff;
  --display:"Bricolage Grotesque","Public Sans",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--txt);
  font:400 17px/1.65 "Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  padding:40px max(20px,env(safe-area-inset-right,0px)) 40px max(20px,env(safe-area-inset-left,0px))}
main{max-width:34rem}
h1{font:800 clamp(32px,7vw,56px)/1.02 var(--display);letter-spacing:-.025em;margin:0;text-wrap:balance}
p{color:var(--txt-2);margin:18px 0 0}
.acoes{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.btn{display:inline-block;padding:16px 28px;border-radius:99px;font:700 16px/1 var(--display);text-decoration:none;background:var(--roxo);color:#fff}
.btn-2{background:transparent;color:var(--txt);box-shadow:inset 0 0 0 1px var(--borda-2)}
@media (hover:hover){.btn:hover{background:var(--roxo-2)}.btn-2:hover{background:var(--sup)}}
:focus-visible{outline:2px solid var(--roxo-3);outline-offset:3px;border-radius:4px}
</style>
</head>
<body>
<main>
  <h1>Essa página não existe mais.</h1>
  <p>O link que você abriu era do meu portfólio antigo. Hoje o site mostra os sites que eu faço para empresas de Pato Branco.</p>
  <div class="acoes">
    <a class="btn" href="/">Ver o site</a>
    <a class="btn btn-2" href="https://wa.me/5546999355001" target="_blank" rel="noopener">Chamar no WhatsApp</a>
  </div>
</main>
</body>
</html>
